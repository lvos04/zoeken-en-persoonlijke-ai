# CI: lint, typen, tests met PostgreSQL 16 + pgvector, migraties op/neer, OpenAPI-drift, pip-audit, dienst-E2E
# (simulator), drift van de Peil-kopie met de bron in ai-server-manager (O-14), browsercontrole van de statuspagina
# (Peil-controles, axe-core, 320 px, CSP; ook tegen de echte dienst met testdata) en de alles-in-één image bouwen +
# starten met healthcheck. Acties en images op SHA/digest gepind.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:0.8.7-pg16-bookworm@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SEARCH_AI_TEST_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Installeren
        run: |
          python -m pip install --disable-pip-version-check -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check -e 'apps/api[dev]'
      - name: Ruff (lint + opmaak)
        run: |
          (cd apps/api && ruff check . && ruff format --check .)
          ruff check tests/e2e tests/interop tests/ui deploy/allinone && ruff format --check tests/e2e tests/interop tests/ui deploy/allinone
      - name: Mypy
        working-directory: apps/api
        run: mypy
      - name: Peil-bron op de gepinde commit en de werkbranch ophalen (O-14, pinregel E08)
        run: |
          commit="$(sed -n '1s/.* @ \([0-9a-f]\{40\}\) .*/\1/p' design/ontwerptaal/statuspagina.html)"
          test -n "$commit"
          raw="https://raw.githubusercontent.com/lvos04/ai-server-manager"
          mkdir -p "$RUNNER_TEMP/peil-bron" "$RUNNER_TEMP/peil-werkbranch"
          for f in statuspagina.html statuspagina.css; do
            curl -fsSL --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/peil-bron/$f" "$raw/$commit/design/ontwerptaal/$f"
            curl -fsSL --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/peil-werkbranch/$f" \
              "$raw/ccr-c133d7a0-kuz1cv/design/ontwerptaal/$f"
          done
          # referentie-renderer (Peil 1.1.1, E07) op dezelfde commit, voor de byte-vergelijking met de eigen renderer
          curl -fsSL --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/peil-bron/sjabloon.py" \
            "$raw/$commit/design/ontwerptaal/bouw/sjabloon.py"
          echo "PEIL_BRON_DIR=$RUNNER_TEMP/peil-bron" >> "$GITHUB_ENV"
          echo "PEIL_WERKBRANCH_DIR=$RUNNER_TEMP/peil-werkbranch" >> "$GITHUB_ENV"
          echo "PEIL_BRON_VERPLICHT=1" >> "$GITHUB_ENV"
      - name: Drift van de Peil-kopie met de bron (faalt bij drift)
        working-directory: apps/api
        run: pytest -q tests/unit/test_peil_kopie.py -p no:cacheprovider
      - name: Contractbron op de vaste commit ophalen (contract 1.3 kop, C1.3-ALG-01)
        run: |
          commit="$(sed -n 's/^BRON_COMMIT = "\([0-9a-f]\{40\}\)"$/\1/p' apps/api/tests/unit/test_contract_kopie.py)"
          test -n "$commit"
          mkdir -p "$RUNNER_TEMP/contract-bron"
          for f in PLATFORM_CONTRACTEN.md CONTRACT_1.3_CONFORMITEIT.md; do
            curl -fsSL --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/contract-bron/$f" \
              "https://raw.githubusercontent.com/lvos04/ai-server-manager/$commit/docs/platform-v2/$f"
          done
          echo "CONTRACT_BRON_DIR=$RUNNER_TEMP/contract-bron" >> "$GITHUB_ENV"
          echo "CONTRACT_BRON_VERPLICHT=1" >> "$GITHUB_ENV"
      - name: Drift van de contractkopie met de bron (faalt bij drift)
        working-directory: apps/api
        run: pytest -q tests/unit/test_contract_kopie.py -p no:cacheprovider
      - name: Unit- en integratietests
        working-directory: apps/api
        run: pytest -q
      - name: Migraties op en neer
        env:
          SEARCH_AI_DATA_DIR: ${{ runner.temp }}/zoek-mig
          SEARCH_AI_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/zoek_ci_mig
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE zoek_ci_mig'
          python -m search_ai migrate
          python -m search_ai migrate --down base
          python -m search_ai migrate
      - name: OpenAPI-drift
        run: |
          python -m search_ai openapi --out docs/openapi/zoeken-en-persoonlijke-ai.openapi.json
          git diff --exit-code docs/openapi/
      - name: Dienst-E2E (simulator)
        run: pytest -q tests/e2e -p no:cacheprovider
      - name: pip-audit (runtime-afhankelijkheden)
        run: pip-audit -r apps/api/requirements.lock --progress-spinner off

  statuspagina-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:0.8.7-pg16-bookworm@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SEARCH_AI_TEST_ADMIN_URL: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Installeren (dienst, Playwright + axe-core uit package-lock.json)
        run: |
          python -m pip install --disable-pip-version-check -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          cd tests/ui && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Toestanden renderen met de echte renderer en het Peil-sjabloon
        run: python tests/ui/render_toestanden.py --out "$RUNNER_TEMP/statuspagina"
      - name: Peil-controles (axe-core 0, contrast in de DOM, 44 px, 320 px, focus, woorden), CSP, schermafdrukken
        run: >-
          node tests/ui/statuspagina.mjs --in "$RUNNER_TEMP/statuspagina"
          --rapport "$RUNNER_TEMP/statuspagina/rapport.json"
          --schermafdrukken "$RUNNER_TEMP/statuspagina/schermafdrukken"
      - name: Ontwerpreview tegen de echte dienst (PostgreSQL, Hub-simulators, alle toestanden, Peil-controles)
        run: >-
          python tests/ui/echte_dienst.py --out "$RUNNER_TEMP/echte-dienst"
          --rapport "$RUNNER_TEMP/echte-dienst/CONTROLE.json"
      - name: Rapport en schermafdrukken bewaren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statuspagina-peil
          path: |
            ${{ runner.temp }}/statuspagina
            ${{ runner.temp }}/echte-dienst
          retention-days: 14

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Alles-in-één image bouwen
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          load: true
          tags: zoeken-en-persoonlijke-ai:ci
          build-args: VERSION=${{ github.sha }}
      - name: Starten, healthcheck en rooktest
        run: deploy/allinone/smoke-test.sh zoeken-en-persoonlijke-ai:ci
