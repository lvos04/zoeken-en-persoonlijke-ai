# Release: tag vX.Y.Z → alles-in-één image naar GHCR (exacte versie, nooit 'latest'), SBOM en
# release/digests.json met de digest (voor het manifest). Acties op commit-SHA gepind.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Versie controleren
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(cat VERSION)" || { echo "Tag $GITHUB_REF_NAME past niet bij VERSION $(cat VERSION)"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bouwen en pushen
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/zoeken-en-persoonlijke-ai:${{ steps.v.outputs.version }}
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/zoeken-en-persoonlijke-ai:${{ steps.v.outputs.version }}
          format: spdx-json
          output-file: release/sbom.spdx.json
      - name: Digest vastleggen
        run: |
          mkdir -p release
          cat > release/digests.json <<JSON
          {"app_id": "zoeken-en-persoonlijke-ai", "version": "${{ steps.v.outputs.version }}",
           "image": "ghcr.io/${{ github.repository_owner }}/zoeken-en-persoonlijke-ai",
           "tag": "${{ steps.v.outputs.version }}", "digest": "${{ steps.push.outputs.digest }}"}
          JSON
          cat release/digests.json
      - name: Releasebestanden toevoegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "zoeken-en-persoonlijke-ai $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md release/digests.json release/sbom.spdx.json || \
          gh release upload "$GITHUB_REF_NAME" release/digests.json release/sbom.spdx.json --clobber
