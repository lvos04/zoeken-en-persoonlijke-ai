name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12 en PostgreSQL-client 16 klaarzetten
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3.12-venv postgresql-client-16
          python3.12 -m venv "$RUNNER_TEMP/dienst"
          echo "$RUNNER_TEMP/dienst/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          bash .forgejo/testdatabase.sh
      - name: Installeren
        run: |
          python -m pip install --disable-pip-version-check -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check -e 'apps/api[dev]'
      - name: Ruff (lint + opmaak)
        run: |
          (cd apps/api && ruff check . && ruff format --check .)
          ruff check tests/e2e tests/interop tests/ui deploy/allinone && ruff format --check tests/e2e tests/interop tests/ui deploy/allinone
      - name: Mypy
        working-directory: apps/api
        run: mypy
      - name: Unit- en integratietests
        working-directory: apps/api
        run: |
          # De negatieve healthcheckproef draait als een gewone gebruiker buiten de dienstgroep.
          testmap=$(mktemp -d "$RUNNER_TEMP/zoek-gebruiker-XXXXXXXX")
          trap 'rm -rf "$testmap"' EXIT
          chown nobody:nogroup "$testmap"
          TMPDIR="$testmap" XDG_CACHE_HOME="$testmap/cache" setpriv --reuid=nobody --regid=nogroup --clear-groups \
            "$RUNNER_TEMP/dienst/bin/python" -m pytest -q -p no:cacheprovider
      - name: Migraties op en neer
        env:
          SEARCH_AI_DATA_DIR: ${{ runner.temp }}/zoek-mig
        run: |
          export SEARCH_AI_DATABASE_URL="${SEARCH_AI_TEST_ADMIN_URL%/*}/zoek_ci_mig"
          psql -d postgres -c 'CREATE DATABASE zoek_ci_mig'
          python -m search_ai migrate
          python -m search_ai migrate --down base
          python -m search_ai migrate
      - name: OpenAPI-drift
        run: |
          python -m search_ai openapi --out docs/openapi/zoeken-en-persoonlijke-ai.openapi.json
          git diff --exit-code docs/openapi/
      - name: Dienst-E2E (simulator)
        run: pytest -q tests/e2e -p no:cacheprovider
      - name: pip-audit (runtime-afhankelijkheden)
        run: pip-audit -r apps/api/requirements.lock --progress-spinner off
      - name: Eigen testdatabase en netwerk opruimen
        if: always()
        run: bash .forgejo/testdatabase.sh stop

  statuspagina-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12 en PostgreSQL-client 16 klaarzetten
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3.12-venv postgresql-client-16
          python3.12 -m venv "$RUNNER_TEMP/dienst"
          echo "$RUNNER_TEMP/dienst/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          bash .forgejo/testdatabase.sh
      - uses: https://code.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Installeren (dienst, Playwright + axe-core uit package-lock.json)
        run: |
          python -m pip install --disable-pip-version-check -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          cd tests/ui && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Toestanden renderen met de echte renderer en het Peil-sjabloon
        run: python tests/ui/render_toestanden.py --out "$RUNNER_TEMP/statuspagina"
      - name: Peil-controles (axe-core 0, contrast in de DOM, 44 px, 320 px, focus, woorden), CSP, schermafdrukken
        run: >-
          node tests/ui/statuspagina.mjs --in "$RUNNER_TEMP/statuspagina"
          --rapport "$RUNNER_TEMP/statuspagina/rapport.json"
          --schermafdrukken "$RUNNER_TEMP/statuspagina/schermafdrukken"
      - name: Ontwerpreview tegen de echte dienst (PostgreSQL, Hub-simulators, alle toestanden, Peil-controles)
        run: >-
          python tests/ui/echte_dienst.py --out "$RUNNER_TEMP/echte-dienst"
          --rapport "$RUNNER_TEMP/echte-dienst/CONTROLE.json"
      - name: Rapport en schermafdrukken bewaren
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # Forgejo v4
        with:
          name: statuspagina-peil
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/statuspagina
            ${{ runner.temp }}/echte-dienst/CONTROLE.json
            ${{ runner.temp }}/echte-dienst/schermafdrukken
          retention-days: 14
      - name: Eigen testdatabase en netwerk opruimen
        if: always()
        run: bash .forgejo/testdatabase.sh stop

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: python
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Alles-in-één image bouwen, starten en controleren
        run: |
          image="zoeken-en-persoonlijke-ai:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker image rm "$image" >/dev/null' EXIT
          docker buildx build --load -f deploy/allinone/Dockerfile --build-arg "VERSION=$GITHUB_SHA" -t "$image" .
          deploy/allinone/smoke-test.sh "$image"
