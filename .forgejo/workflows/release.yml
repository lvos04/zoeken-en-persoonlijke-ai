name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IMAGE: git.medialeon.nl/leon/zoeken-en-persoonlijke-ai
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Versie controleren
        id: v
        run: |
          versie="${GITHUB_REF_NAME#v}"
          test "$versie" = "$(cat VERSION)" || { echo "Tag past niet bij VERSION"; exit 1; }
          echo "versie=$versie" >> "$GITHUB_OUTPUT"
          mkdir -p release
      - uses: https://github.com/docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: https://github.com/docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: git.medialeon.nl
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Versie-image bouwen en publiceren met herkomstbewijs en SBOM
        id: push
        uses: https://github.com/docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: VERSION=${{ steps.v.outputs.versie }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.versie }}
      - name: SPDX-bestand van de gepubliceerde digest maken
        uses: https://github.com/anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Digest vastleggen
        env:
          VERSIE: ${{ steps.v.outputs.versie }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          jq -en --arg v "$VERSIE" --arg image "$IMAGE" --arg digest "$DIGEST" '
            select($digest | test("^sha256:[0-9a-f]{64}$")) |
            {app_id: "zoeken-en-persoonlijke-ai", version: $v, image: $image, tag: $v, digest: $digest}
          ' > release/digests.json
          jq -e '.spdxVersion and .packages' release/sbom.spdx.json > /dev/null
      - name: SPDX-bestand als runartefact bewaren
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # Forgejo v4
        with:
          name: sbom-spdx
          path: release/sbom.spdx.json
          if-no-files-found: error
      - name: Bestanden toevoegen aan de Forgejo-release
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: bash .forgejo/releasebestanden.sh
