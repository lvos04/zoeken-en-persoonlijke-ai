name: broncontrole
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  bronnen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toegang tot beide privé-bronrepo's controleren
        env:
          BRON_TOKEN: ${{ secrets.CI_BRONNEN_LEZEN || github.token }}
        run: |
          ontbreekt=0
          for repo in ai-server-manager appstore-en-fork; do
            status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' -H "Authorization: token $BRON_TOKEN" \
              "$GITHUB_SERVER_URL/api/v1/repos/leon/$repo")
            echo "Leesrecht leon/$repo — HTTP $status"
            if [ "$status" != 200 ]; then ontbreekt=1; fi
          done
          exit "$ontbreekt"
      - name: Dienst en tests installeren
        run: |
          python3.12 -m venv "$RUNNER_TEMP/dienst"
          "$RUNNER_TEMP/dienst/bin/pip" install --disable-pip-version-check -r apps/api/requirements.lock
          "$RUNNER_TEMP/dienst/bin/pip" install --disable-pip-version-check -e 'apps/api[dev]'
          echo "$RUNNER_TEMP/dienst/bin" >> "$GITHUB_PATH"
      - name: Peil-bron op de gepinde commit en de werkbranch ophalen (O-14, pinregel E08)
        env:
          BRON_TOKEN: ${{ secrets.CI_BRONNEN_LEZEN || github.token }}
        run: |
          commit="$(sed -n '1s/.* @ \([0-9a-f]\{40\}\) .*/\1/p' design/ontwerptaal/statuspagina.html)"
          test -n "$commit"
          raw="$GITHUB_SERVER_URL/api/v1/repos/leon/ai-server-manager/raw"
          mkdir -p "$RUNNER_TEMP/peil-bron" "$RUNNER_TEMP/peil-werkbranch"
          for f in statuspagina.html statuspagina.css; do
            curl -fsS -H "Authorization: token $BRON_TOKEN" --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/peil-bron/$f" "$raw/design/ontwerptaal/$f?ref=$commit"
            curl -fsS -H "Authorization: token $BRON_TOKEN" --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/peil-werkbranch/$f" \
              "$raw/design/ontwerptaal/$f?ref=ccr-c133d7a0-kuz1cv"
          done
          # referentie-renderer (Peil 1.1.1, E07) op dezelfde commit, voor de byte-vergelijking met de eigen renderer
          curl -fsS -H "Authorization: token $BRON_TOKEN" --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/peil-bron/sjabloon.py" \
            "$raw/design/ontwerptaal/bouw/sjabloon.py?ref=$commit"
          {
            echo "PEIL_BRON_DIR=$RUNNER_TEMP/peil-bron"
            echo "PEIL_WERKBRANCH_DIR=$RUNNER_TEMP/peil-werkbranch"
            echo "PEIL_BRON_VERPLICHT=1"
          } >> "$GITHUB_ENV"
      - name: Drift van de Peil-kopie met de bron (faalt bij drift)
        working-directory: apps/api
        run: pytest -q tests/unit/test_peil_kopie.py -p no:cacheprovider
      - name: Contractbron op de vaste commit ophalen (contract 1.3 kop, C1.3-ALG-01)
        env:
          BRON_TOKEN: ${{ secrets.CI_BRONNEN_LEZEN || github.token }}
        run: |
          commit="$(sed -n 's/^BRON_COMMIT = "\([0-9a-f]\{40\}\)"$/\1/p' apps/api/tests/unit/test_contract_kopie.py)"
          test -n "$commit"
          mkdir -p "$RUNNER_TEMP/contract-bron"
          for f in PLATFORM_CONTRACTEN.md CONTRACT_1.3_CONFORMITEIT.md; do
            curl -fsS -H "Authorization: token $BRON_TOKEN" --retry 4 --retry-delay 2 -o "$RUNNER_TEMP/contract-bron/$f" \
              "$GITHUB_SERVER_URL/api/v1/repos/leon/ai-server-manager/raw/docs/platform-v2/$f?ref=$commit"
          done
          {
            echo "CONTRACT_BRON_DIR=$RUNNER_TEMP/contract-bron"
            echo "CONTRACT_BRON_VERPLICHT=1"
          } >> "$GITHUB_ENV"
      - name: Drift van de contractkopie met de bron (faalt bij drift)
        working-directory: apps/api
        run: pytest -q tests/unit/test_contract_kopie.py -p no:cacheprovider
      - name: Manifestvalidator van appstore-en-fork op een vaste commit (contract 1.3 §9, C1.3-ZPA-13; alleen lezen)
        env:
          BRON_TOKEN: ${{ secrets.CI_BRONNEN_LEZEN || github.token }}
          VALIDATOR_COMMIT: a994c2a51f45b81b2c48c6533b0ccf51ba857f5a
        run: |
          dir="$RUNNER_TEMP/appstore"
          mkdir -p "$dir"
          curl -fsS --retry 4 -H "Authorization: token $BRON_TOKEN" -o "$RUNNER_TEMP/validator.tar.gz" \
            "$GITHUB_SERVER_URL/api/v1/repos/leon/appstore-en-fork/archive/$VALIDATOR_COMMIT.tar.gz"
          tar -xzf "$RUNNER_TEMP/validator.tar.gz" --strip-components=1 -C "$dir"
          python -m venv "$RUNNER_TEMP/validator"
          "$RUNNER_TEMP/validator/bin/pip" install --disable-pip-version-check -q --require-hashes \
            -r "$dir/apps/api/requirements.lock"
          "$RUNNER_TEMP/validator/bin/pip" install --disable-pip-version-check -q --no-deps "$dir/apps/api"
          "$RUNNER_TEMP/validator/bin/jl-manifest" validate --strict deploy/manifest/zoeken-en-persoonlijke-ai.manifest.yaml
          {
            echo "JL_MANIFEST=$RUNNER_TEMP/validator/bin/jl-manifest"
            echo "MANIFEST_VALIDATOR_VERPLICHT=1"
          } >> "$GITHUB_ENV"
      - name: Bytevergelijking met de referentierenderer en positieve en negatieve manifestproef
        working-directory: apps/api
        run: >-
          pytest -q tests/unit/test_statuspagina_peil.py::test_zelfde_uitkomst_als_de_referentie_renderer
          tests/unit/test_deploy_artifacts.py::test_manifest_strict_geldig_met_de_validator_van_appstore_en_fork
